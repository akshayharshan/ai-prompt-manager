services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aiprompt
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    restart: always
    depends_on:
      - db
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - .:/app
  redis:
    image: redis:8.6-alpine
    restart: always
    container_name: ai_prompt_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf
      # - ./ssl:/etc/nginx/ssl
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data: